name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - main
      - develop
      - staging

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Rulesync check
        run: bun run rulesync:check

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  preview:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action != 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::GitHub Secrets が未設定です。Settings → Secrets and variables → Actions に CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID を追加してください。" >&2
            echo "CLOUDFLARE_API_TOKEN: Workers Scripts Edit + D1 Edit 権限の API トークン" >&2
            echo "CLOUDFLARE_ACCOUNT_ID: Cloudflare ダッシュボード右サイドバーの Account ID" >&2
            exit 1
          fi

      - name: Deploy preview with isolated D1
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          RESULT_FILE="${RUNNER_TEMP}/preview-result.env"
          result_path="$(
            bash scripts/deploy-preview.sh "${{ github.event.pull_request.number }}" "${RESULT_FILE}" \
              | grep '^preview_result_file=' \
              | cut -d= -f2-
          )"

          if [[ -z "$result_path" || ! -f "$result_path" ]]; then
            echo "FAIL: preview result file was not created" >&2
            exit 1
          fi

          preview_url="$(grep '^preview_url=' "$result_path" | cut -d= -f2-)"
          database_name="$(grep '^database_name=' "$result_path" | cut -d= -f2-)"

          if [[ -z "$preview_url" || -z "$database_name" ]]; then
            echo "FAIL: preview_url or database_name is empty" >&2
            cat "$result_path" >&2 || true
            exit 1
          fi

          {
            echo "preview_url=${preview_url}"
            echo "database_name=${database_name}"
          } >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: steps.deploy.outputs.preview_url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          DATABASE_NAME: ${{ steps.deploy.outputs.database_name }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL ?? ''
            const databaseName = process.env.DATABASE_NAME ?? ''
            const prNumber = context.payload.pull_request.number

            if (!previewUrl || !databaseName) {
              core.setFailed('Preview deployment outputs are missing')
              return
            }

            const tag = '<!-- prottype-preview -->'
            const body = `${tag}
            ## Preview deployment

            | | |
            | --- | --- |
            | Preview URL | ${previewUrl} |
            | D1 database | \`${databaseName}\`（PR 専用・develop と分離） |

            Updated at \`${context.sha.substring(0, 7)}\` — PR #${prNumber}
            `

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            })

            const existing = comments.find((comment) => comment.body?.includes(tag))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              })
            }

  preview-cleanup:
    if: >-
      github.event_name == 'pull_request'
      && github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Delete preview D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "skip: CLOUDFLARE_* secrets not configured"
            exit 0
          fi
          bash scripts/preview-d1.sh delete "${{ github.event.pull_request.number }}"
